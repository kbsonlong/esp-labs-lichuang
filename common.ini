; 所有 lab 共享的板级配置。labs/<lab>/platformio.ini 通过 extra_configs 引入本文件。
; 路径相对 lab 目录，每个 lab 深度一致（labs/<lab>）。

[platformio]
; lib 依赖与编译缓存放 repo 根目录，全部 lab 共享一份。
libdeps_dir = ../../.pio/libdeps
build_cache_dir = ../../.pio/build-cache

[env]
; pioarduino = 社区维护的 platform，随附 Arduino-ESP32 3.x（锁定版本，与上游 esp-labs 一致）。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; 精确匹配实战派的模组：ESP32-S3-WROOM-1-N16R8（16 MB 四线 flash + 8 MB 八线 PSRAM）。
board = esp32-s3-devkitc1-n16r8
framework = arduino
build_flags =
    ; 0 none, 1 error, 2 warn, 3 info, 4 debug, 5 verbose。驱动 log_e/log_w/log_i/log_d。
    -DCORE_DEBUG_LEVEL=3
    -Wall
    ; USB = 硬件 USB-Serial-JTAG，且把 Serial 映射到 USB：
    ; 不开 CDC_ON_BOOT 的话 Serial 的 TX 日志能出去（走了日志后门），但 RX 收不到
    ; ——用户在监视器里敲的任何字符都会石沉大海。这两行是实战派/S3 教程的隐形地基。
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../../kit/include
; 留空则 PlatformIO 自动探测端口。需要强制指定时设置 ESP_PORT 环境变量。
upload_port = ${sysenv.ESP_PORT}
monitor_port = ${sysenv.ESP_PORT}
monitor_speed = 115200
; time: 每行加时间戳 · colorize: 日志级别着色 · esp32_exception_decoder: 崩溃堆栈可读化
monitor_filters = time, colorize, esp32_exception_decoder
; 允许在串口监视器里输入（交互式课程用）。
monitor_echo = yes
monitor_eol = LF

; ----- 库集合 ---------------------------------------------------------------------------

[display]
; 板载 2.0" 320x240 ST7789（SPI，CS 板内接地）。
; 用 LovyanGFX 而不是 Adafruit ST7789：官方固件（xiaozhi）这块屏跑在 SPI mode 2，
; Adafruit 库写死 mode 0，真机实测屏不显示；LovyanGFX 的 bus 配置允许指定 spi_mode。
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
lib_ignore =

[json]
; W2 起解析 API 返回的 JSON 用。7.x 的 Document 自动管理内存，不需要预分配容量。
lib_deps =
    bblanchon/ArduinoJson@7.4.3

[ble]
; BLE 用 h2zero 的 NimBLE-Arduino，而不是官方 Bluedroid API：体积小一半、API 正常人能记住。
; 2.x 是重大重构版（回调带 NimBLEConnInfo、Advertising 类拆分），网上 1.x 的老教程代码很多编译不过。
; 上游 esp-labs 用法：使用方在 build_flags 加 -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1 压掉详细日志。
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
