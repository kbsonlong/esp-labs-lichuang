; B1 BLE 广播。独立 PlatformIO 工程，共享配置在 ../../common.ini。

[platformio]
default_envs = ble-lab-b1
extra_configs = ../../common.ini

[env:ble-lab-b1]
build_flags =
    ${env.build_flags}
    ; NimBLE 日志只留 error（0 none 1 error 2 warn ...），否则串口被 BLE 调试刷屏。
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
lib_deps =
    ${display.lib_deps}
    ${ble.lib_deps}
